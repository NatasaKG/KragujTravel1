  <div style="padding-bottom:clamp(32px,4vw,56px);">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;">

        <div style="font-family:Spectral,serif;font-size:44px;line-height:0.6;color:#9717D1;">“</div>
        <blockquote style="margin:0;font-family:Spectral,serif;font-size:19px;line-height:1.5;color:#1F1B16;flex:1;">Pariz smo obišli za četiri dana bez ijednog stresa. Prevoz do aerodroma iz Kragujevca je bio tačan u minut, a hotel na pešačkoj udaljenosti od Luvra.</blockquote>

        </figcaption>
      </figure>

      <figure style="margin:0;background:#FEFCF8;border:1px solid rgba(31,27,22,0.09);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:22px;box-shadow:0 12px 30px -24px rgba(31,27,22,0.5);">
        <div style="font-family:Spectral,serif;font-size:44px;line-height:0.6;color:#9717D1;">“</div>
        <blockquote style="margin:0;font-family:Spectral,serif;font-size:19px;line-height:1.5;color:#1F1B16;flex:1;">Prvi put sam išao autobusom na ovako dugu turu i bio sam skeptičan. Vodič je znao priču za svaku ulicu, a Beč i Minhen usput su bili pravi bonus.</blockquote>
        <figcaption style="display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px solid rgba(31,27,22,0.09);">
          <div aria-hidden="true" style="width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#EFE9DD;color:#9717D1;font-family:Spectral,serif;font-weight:600;font-size:16px;">NP</div>
          <div><div style="font-size:15px;font-weight:600;">Nikola Petrović</div><div style="font-size:13px;color:#8a8377;margin-top:3px;">Pariz — velika tura · autobusom</div></div>

      </figure>

      <figure style="margin:0;background:#FEFCF8;border:1px solid rgba(31,27,22,0.09);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:22px;box-shadow:0 12px 30px -24px rgba(31,27,22,0.5);">
        <div style="font-family:Spectral,serif;font-size:44px;line-height:0.6;color:#9717D1;">“</div>
        <blockquote style="margin:0;font-family:Spectral,serif;font-size:19px;line-height:1.5;color:#1F1B16;flex:1;">Lisabon je bio naš poklon za godišnjicu. Izlet u Sintru je bio vrhunac putovanja, a sve je bilo organizovano do detalja.</blockquote>
        <figcaption style="display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px solid rgba(31,27,22,0.09);">

          <div><div style="font-size:15px;font-weight:600;">Ana i Marko Jovanović</div><div style="font-size:13px;color:#8a8377;margin-top:3px;">Lisabon · avionom</div></div>

        <div style="font-family:Spectral,serif;font-size:44px;line-height:0.6;color:#9717D1;">“</div>
        <blockquote style="margin:0;font-family:Spectral,serif;font-size:19px;line-height:1.5;color:#1F1B16;flex:1;">Prag i Beč u šest dana, sa odličnim odnosom cene i onoga što smo videli. Putovala sam sa mamom i obe smo oduševljene.</blockquote>
        <figcaption style="display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px solid rgba(31,27,22,0.09);">

      <figure style="margin:0;background:#FEFCF8;border:1px solid rgba(31,27,22,0.09);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:22px;box-shadow:0 12px 30px -24px rgba(31,27,22,0.5);">

        <blockquote style="margin:0;font-family:Spectral,serif;font-size:19px;line-height:1.5;color:#1F1B16;flex:1;">Produženi vikend u Rimu bio je tačno ono što nam je trebalo. Cena je bila ona koja je navedena, bez ikakvih doplata na licu mesta.</blockquote>
